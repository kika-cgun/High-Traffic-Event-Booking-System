spring:
  application:
    name: High-Traffic-Event-Booking-System

  # Konfiguracja Bazy Danych
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:event_booking_system_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Konfiguracja Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Konfiguracja RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}

  # Konfiguracja Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Retry przy przejściowych błędach sieci
      retries: 3
    consumer:
      # Czytaj od początku przy pierwszym starcie consumer group
      auto-offset-reset: earliest

# Konfiguracja JWT
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:dev-secret-key-at-least-256-bits-long-for-hmac}
    expiration-time: ${JWT_EXPIRATION_TIME:3600000}
    refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800000}
