<div class="pit-selector">
  <div class="pit-icon">🎤</div>
  <h3 class="pit-title">Strefa PIT</h3>
  <p class="pit-desc">Stojace miejsca przy scenie. Wybierz liczbe wejsciowek.</p>

  <div class="counter">
    <button mat-icon-button (click)="decrement()" [disabled]="count() === 0">
      <mat-icon>remove</mat-icon>
    </button>
    <span class="count">{{ count() }}</span>
    <button mat-icon-button (click)="increment()" [disabled]="count() >= maxSeats()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <p class="price-info">
    {{ pricePerSeat() | currency:'PLN':'symbol':'1.2-2':'pl' }} / os.
    &nbsp;&middot;&nbsp;
    Lacznie: {{ total() | currency:'PLN':'symbol':'1.2-2':'pl' }}
  </p>

  <button mat-flat-button color="primary" [disabled]="count() === 0" (click)="reserve()">
    Zarezerwuj {{ count() }} wejsciowek PIT
  </button>
</div>
