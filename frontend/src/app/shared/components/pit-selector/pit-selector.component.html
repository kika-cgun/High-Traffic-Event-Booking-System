<div class="pit-selector">
  <div class="pit-icon">🎤</div>
  <h3 class="pit-title">PIT Zone</h3>
  <p class="pit-desc">Standing area by the stage. Select number of passes.</p>

  <div class="counter">
    <button mat-icon-button (click)="decrement()" [disabled]="count() === 0">
      <mat-icon>remove</mat-icon>
    </button>
    <span class="count">{{ count() }}</span>
    <button mat-icon-button (click)="increment()" [disabled]="count() >= maxSeats()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <p class="price-info">
    {{ pricePerSeat() | currency:'PLN':'symbol':'1.2-2':'en' }} / person
    &nbsp;&middot;&nbsp;
    Total: {{ total() | currency:'PLN':'symbol':'1.2-2':'en' }}
  </p>

  <button mat-flat-button color="primary" [disabled]="count() === 0" (click)="reserve()">
    Reserve {{ count() }} PIT passes
  </button>
</div>
