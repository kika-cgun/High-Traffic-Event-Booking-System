<div class="grid-wrapper">
  <div class="stage">STAGE / SCENA</div>

  @for (sec of sections(); track sec.section) {
    <div class="section">
      <h3 class="section-label">Sekcja {{ sec.section }}</h3>

      @for (row of sec.rows; track row.rowNumber) {
        <div class="seat-row">
          <span class="row-num">{{ row.rowNumber }}</span>

          @for (seat of row.seats; track seat.id) {
            <button
              class="seat-btn"
              [class.available]="!seat.reserved && !isSelected(seat)"
              [class.selected]="isSelected(seat)"
              [class.reserved]="seat.reserved"
              [disabled]="seat.reserved"
              [matTooltip]="seat.reserved ? 'Zarezerwowane' : (isSelected(seat) ? 'Kliknij aby odznaczic' : 'Rzad ' + seat.rowNumber + ', Miejsce ' + seat.seatNumber + ' — ' + seat.price + ' PLN')"
              (click)="toggle(seat)">
              {{ seat.seatNumber }}
            </button>
          }
        </div>
      }
    </div>
  }

  <div class="legend">
    <span class="legend-item"><span class="dot available"></span> Wolne</span>
    <span class="legend-item"><span class="dot selected"></span> Wybrane</span>
    <span class="legend-item"><span class="dot reserved"></span> Zarezerwowane</span>
  </div>

  @if (selectedCount() > 0) {
    <div class="reserve-bar">
      <button mat-flat-button color="primary" (click)="reserve()">
        Zarezerwuj {{ selectedCount() }} {{ selectedCount() === 1 ? 'miejsce' : 'miejsca' }}
        — {{ totalPrice() | currency:'PLN':'symbol':'1.2-2':'pl' }}
      </button>
    </div>
  }
</div>
