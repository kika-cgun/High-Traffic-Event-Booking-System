<div class="grid-wrapper">
  <div class="stage">STAGE</div>

  @for (sec of sections(); track sec.section) {
    <div class="section">
      <h3 class="section-label">Section {{ sec.section }}</h3>

      @for (row of sec.rows; track row.rowNumber) {
        <div class="seat-row">
          <span class="row-num">{{ row.rowNumber }}</span>

          @for (seat of row.seats; track seat.id) {
            <button
              class="seat-btn"
              [class.available]="!seat.reserved"
              [class.reserved]="seat.reserved"
              [disabled]="seat.reserved"
              [matTooltip]="seat.reserved ? 'Reserved' : 'Row ' + seat.rowNumber + ', Seat ' + seat.seatNumber"
              (click)="select(seat)">
              {{ seat.seatNumber }}
            </button>
          }
        </div>
      }
    </div>
  }

  <div class="legend">
    <span class="legend-item"><span class="dot available"></span> Available</span>
    <span class="legend-item"><span class="dot reserved"></span> Reserved</span>
  </div>
</div>
